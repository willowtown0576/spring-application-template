services:
  postgres:
    image: postgres:18.6
    profiles: [dev]
    environment:
      POSTGRES_DB: application
      POSTGRES_USER: application
      POSTGRES_PASSWORD: ${DEV_DB_PASSWORD:?Set DEV_DB_PASSWORD before bootRun}
    ports:
      - "127.0.0.1::5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 5s
      retries: 30

  docs-postgres:
    image: postgres:18.6
    profiles: [docs]
    environment:
      POSTGRES_DB: documentation
      POSTGRES_USER: documentation
      POSTGRES_PASSWORD: ${DOCS_DB_PASSWORD:-unused}
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U documentation -d documentation']
      interval: 2s
      timeout: 5s
      retries: 30

  docs-tools:
    image: spring-application-starter-docs:1
    profiles: [docs]
    build:
      context: docs
    environment:
      TBLS_DSN: postgres://documentation:${DOCS_DB_PASSWORD:-unused}@docs-postgres:5432/documentation?sslmode=disable
    volumes:
      - ../:/workspace:ro
      - ../build/documentation:/workspace/build/documentation

volumes:
  postgres-data:
